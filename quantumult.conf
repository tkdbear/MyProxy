[general]
# 配置图标
profile_img_url = https://github.githubassets.com/images/modules/site/integrators/google.png
# 代理测速 URL
server_check_url = http://www.google.com/generate_204
# 测速超时（ms）
server_check_timeout = 5000
# 节点不支持 UDP 时拒绝该 UDP 请求
fallback_udp_policy = reject
# UDP 白名单
udp_whitelist = 1-442, 444-65535
# 节点信息显示
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 资源解析器
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# 运行模式模块，即根据网络自动切换 分流/直连/全局代理 等模式。
running_mode_trigger = filter, filter, WC:all_direct, WC_5G:all_direct
# 跳过 QuanX 隧道，不经过分流规则
# 暴雪网络兼容项：185.60.112.157/32、185.60.112.158/32、24.105.30.129/32
# 历史公网例外（用途待核实，暂保留）：182.162.132.1/32（LG DACOM KIDC）、193.168.0.1/32（August Storck）
excluded_routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 193.168.0.1/32, 198.51.100.0/24, 24.105.30.129/32, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
# DNS 排除列表
dns_exclusion_list = *.lan, *.direct, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, detectportal.firefox.com, resolver1.opendns.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, global.turn.twilio.com, global.stun.twilio.com, app.yinxiang.com, injections.adguard.org, local.adguard.org, localhost.*.qq.com, localhost.*.weixin.qq.com, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn

