[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;设置规则标志位
;1. 局域网与私有网络国内直连（最高优先级，Lan.list 内部已完整包含所有内网与私有 IP-CIDR）
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Lan/Lan.list

;2. 机场中转加速国内直连（防止中转走代理死锁）
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,toshiba-asdf.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,micron-asdf.com
ruleset=🚀 全球加速,[]DOMAIN-SUFFIX,agoda.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,z-trip.cn


;4. AI 专属分流（候选地区为台湾、日本、新加坡、美国；可用性需实际验证）
ruleset=🤖 人工智能,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 人工智能,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Claude/Claude.list
ruleset=🤖 人工智能,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,robinfrontend-pa.googleapis.com
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,geminiweb-pa.googleapis.com
ruleset=🤖 人工智能,[]DOMAIN,aistudio.google.com
ruleset=🤖 人工智能,[]DOMAIN,notebooklm.google.com
ruleset=🤖 人工智能,[]DOMAIN,api.githubcopilot.com
ruleset=🤖 人工智能,[]DOMAIN,copilot-proxy.githubusercontent.com
ruleset=🤖 人工智能,[]DOMAIN,api.groq.com
ruleset=🤖 人工智能,[]DOMAIN,console.groq.com

;哔哩哔哩专项规则优先于通用媒体规则，默认国内直连
ruleset=📺 哔哩哔哩,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BiliBili/BiliBili.list

;5. 海外媒体（已原生包含 YouTube、Netflix、Disney+ 等全部流媒体）
ruleset=🌍 国际媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GlobalMedia/GlobalMedia.list

;6. 全球代理
ruleset=🚀 全球加速,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list
ruleset=🚀 全球加速,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/d2f60312bb7c35adc0113e1cd1b038ebf8304581/rule/Clash/Developer/Developer.list

;7. 全球国内直连（国内常用与私有网络）
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Direct/Direct.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/SteamCN/SteamCN.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax.list
ruleset=🎯 国内直连,[]GEOIP,CN

;8. 兜底
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位
custom_proxy_group=🚀 全球加速`select`[]♻️ 自动选择`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🔮 负载均衡`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 全球加速`[]🎯 国内直连
custom_proxy_group=🌍 国际媒体`select`[]🚀 全球加速`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🎯 国内直连
custom_proxy_group=📺 哔哩哔哩`select`[]DIRECT`[]🇭🇰 香港节点`[]🇹🇼 台湾节点
custom_proxy_group=🤖 人工智能`select`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🎯 国内直连`select`[]DIRECT`[]🚀 全球加速
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🔮 负载均衡`load-balance`.*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`https://www.google.com/generate_204`300,,150
custom_proxy_group=🇹🇼 台湾节点`url-test`(台|新北|彰化|TW|Taiwan)`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|坡|狮城|SG|Singapore)`https://www.google.com/generate_204`300,,50
;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true
