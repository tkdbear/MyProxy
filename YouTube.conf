########################################
# 应用名称：YouTube 去广告 + 后台播放/画中画 + 简体中文单语字幕自动翻译（多合一）
# 规则地址：https://raw.githubusercontent.com/tkdbear/MyProxy/main/YouTube.conf
########################################

hostname = -redirector*.googlevideo.com, *.googlevideo.com, www.youtube.com, m.youtube.com, s.youtube.com, youtubei.googleapis.com

# ======= 视频广告拦截与重定向 ======= #
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) url 302 $1$2$3
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad url reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads url reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) url reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext url reject-200

# ======= 视频去广告 | 画中画 | 后台播放 | 解锁简体中文字幕选项 ======= #
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch) url script-response-body https://raw.githubusercontent.com/tkdbear/MyProxy/main/youtube.js

# ======= 字幕自动翻译（单语纯简体中文，绕过官方 429 限制） ======= #
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext url script-request-header https://raw.githubusercontent.com/tkdbear/MyProxy/main/youtube.js
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=Translate url script-response-body https://raw.githubusercontent.com/tkdbear/MyProxy/main/youtube.js
